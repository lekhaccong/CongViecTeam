name: Build CongViecTeam APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test server URL validation
        run: |
          mkdir -p /tmp/team-tests
          javac -d /tmp/team-tests android/app/src/main/java/vn/lekhaccong/congviecteam/ServerAddress.java tests/ServerAddressTest.java
          java -cp /tmp/team-tests ServerAddressTest
      - name: Build APK
        working-directory: android
        run: bash gradlew assembleDebug lintDebug --no-daemon --stacktrace
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CongViecTeam-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CongViecTeam-APK
          path: CongViecTeam-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: lan-server
      - run: npm test
        working-directory: lan-server
